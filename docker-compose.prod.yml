# Production locale / préprod : build React statique, Nginx sert les fichiers, pas de hot-reload backend.
# Usage : docker compose -f docker-compose.prod.yml up --build -d
#
# Prérequis : même .env à la racine que pour le dev (COMPOSE_BAKE=false si besoin).

services:
  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
      args:
        REACT_APP_API_URL: /api
    image: transport-frontend-build:local
    volumes:
      - frontend_dist:/output
    command: >
      sh -c "rm -rf /output/* && cp -a /app/build/. /output/"
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/transport.static.conf:/etc/nginx/conf.d/transport.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=database
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=transport_db
      - DB_PORT=5432
      - CORS_ORIGINS=http://localhost,http://127.0.0.1
      # Nombre de workers Uvicorn sous Gunicorn (ajuster selon CPU / charge)
      - WEB_CONCURRENCY=2
    depends_on:
      database:
        condition: service_healthy
    command:
      - sh
      - -c
      - >
        exec gunicorn main:app -k uvicorn.workers.UvicornWorker
        -w "$$WEB_CONCURRENCY" -b 0.0.0.0:8000
        --timeout 120 --graceful-timeout 30 --access-logfile - --error-logfile -
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: transport_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      POSTGRES_LOG_STATEMENT: "none"
      POSTGRES_LOG_ERROR_VERBOSITY: "terse"
    ports:
      - "5432:5432"
    volumes:
      - ./database/data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c tcp_keepalives_idle=300
      -c tcp_keepalives_interval=30
      -c tcp_keepalives_count=3
      -c statement_timeout=300000
      -c idle_in_transaction_session_timeout=30000
      -c log_connections=off
      -c log_disconnections=off
      -c log_statement=none
      -c log_duration=off
      -c log_min_duration_statement=-1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d transport_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./ingestion_pipeline/data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

volumes:
  frontend_dist:
