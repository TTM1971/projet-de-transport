# Reverse proxy : / → React (dev server), /api/ → FastAPI (préfixe retiré)

upstream frontend_app {
    server frontend:3000;
    keepalive 16;
}

upstream backend_api {
    server backend:8000;
    keepalive 16;
}

# HTTP — en production, ajoutez un server 443 avec certificats (voir ssl.conf.example)
server {
    listen 80;
    server_name localhost;

    client_max_body_size 25m;

    # API FastAPI : /api/auth/login → backend /auth/login
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Interface React (dev server ou build statique selon votre déploiement)
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
