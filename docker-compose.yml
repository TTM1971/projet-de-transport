# Pour éviter l'erreur Docker Compose "failed to execute bake: read |0: file already closed",
# lancez avec COMPOSE_BAKE=false (voir README.md).
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=/api
      # Cible du proxy dev (setupProxy.js) : nom du service Docker
      - PROXY_BACKEND=http://backend:8000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    stdin_open: true
    tty: true
    networks:
      - default

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=database
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=transport_db
      - DB_PORT=5432
      # Autoriser l'UI via Nginx (port 80) et accès direct :3000
      - CORS_ORIGINS=http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Exclure venv du volume pour éviter les conflits
      - /app/venv
    # Sans --reload : le hot-reload sur volume Windows/Mac redémarre souvent l’API → 504 / ERR_EMPTY_RESPONSE.
    # Pour le rechargement auto : command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: transport_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      # Configuration pour réduire les erreurs "Broken pipe"
      POSTGRES_LOG_STATEMENT: "none"  # Ne pas logger toutes les requêtes (réduit les logs)
      POSTGRES_LOG_ERROR_VERBOSITY: "terse"  # Logs d'erreur plus compacts
    ports:
      - "5432:5432"
    volumes:
      - ./database/data:/var/lib/postgresql/data
    # Configuration des connexions TCP pour réduire les "Broken pipe"
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c tcp_keepalives_idle=300
      -c tcp_keepalives_interval=30
      -c tcp_keepalives_count=3
      -c statement_timeout=300000
      -c idle_in_transaction_session_timeout=30000
      -c log_connections=off
      -c log_disconnections=off
      -c log_statement=none
      -c log_duration=off
      -c log_min_duration_statement=-1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d transport_db"]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./ingestion_pipeline/data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
